<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro do barbeiro · GoldBarber</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b0b0b; color: #f4f0e8; font: 15px/1.5 Arial, sans-serif; }
    main { width: min(100%, 640px); padding: 36px; border: 1px solid #393329; border-radius: 20px; background: #151515; box-shadow: 0 24px 80px #0008; }
    .eyebrow { color: #c8a665; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(28px, 5vw, 40px); }
    .sub { margin: 0 0 28px; color: #a8a39a; }
    .photo { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
    .avatar { display: grid; width: 76px; height: 76px; place-items: center; overflow: hidden; border: 1px dashed #75684e; border-radius: 50%; background: #211e18; color: #c8a665; font-size: 12px; text-align: center; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    label { display: block; margin-bottom: 7px; color: #e4ddcf; font-size: 13px; }
    .photo input { max-width: 100%; color: #aaa; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .full { grid-column: 1 / -1; }
    .field input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #393631; border-radius: 9px; background: #0d0d0d; color: #fff; font: inherit; }
    input:focus { outline: 1px solid #c8a665; border-color: #c8a665; }
    button { width: 100%; height: 48px; margin-top: 24px; border: 0; border-radius: 9px; background: #c8a665; color: #14110b; font-size: 15px; font-weight: 700; cursor: pointer; }
    .note, #status { margin: 14px 0 0; color: #8f897e; font-size: 12px; text-align: center; }
    #status { color: #d8bf8c; }
    @media (max-width: 540px) { main { padding: 24px; } .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">GoldBarber · Cadastro</span>
    <h1>Crie seu perfil profissional</h1>
    <p class="sub">Cadastre seus dados para fazer parte da plataforma.</p>
    <form id="signup">
      <div class="photo">
        <div class="avatar" id="avatar">Sua foto</div>
        <div>
          <label for="photo">Foto de perfil do barbeiro</label>
          <input id="photo" name="foto" type="file" accept="image/jpeg,image/png,image/webp" required>
        </div>
      </div>
      <div class="grid">
        <div class="field full">
          <label for="name">Nome completo</label>
          <input id="name" name="nome" autocomplete="name" placeholder="Ex.: Lucas Almeida" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
        </div>
        <div class="field">
          <label for="phone">Telefone</label>
          <input id="phone" name="telefone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999" required>
        </div>
        <div class="field full">
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" type="tel" placeholder="(11) 99999-9999" required>
        </div>
        <div class="field full">
          <label for="password">Senha (mínimo de 8 caracteres)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
      </div>
      <button type="submit">Criar cadastro</button>
      <p class="note">Você precisará confirmar seu e-mail para ativar a conta. A senha não é salva nos dados do perfil.</p>
      <div id="status" role="status"></div>
    </form>
  </main>
  <script>
    const SUPABASE_URL = 'https://qfboniifeieauwbjlifp.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zMTYD3WAMHa7i-oJQFl-FA_rC7m0EVu';
    const form = document.getElementById('signup');
    const status = document.getElementById('status');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const whatsappInput = document.getElementById('whatsapp');

    function normalizePhone(value) {
      return value.replace(/\D/g, '');
    }

    document.getElementById('photo').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const image = document.createElement('img');
      image.src = URL.createObjectURL(file);
      document.getElementById('avatar').replaceChildren(image);
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      status.textContent = '';
      if (!form.reportValidity()) return;
      if (SUPABASE_URL.startsWith('COLE_') || SUPABASE_PUBLISHABLE_KEY.startsWith('COLE_')) {
        status.textContent = 'Configure a URL e a chave pública do Supabase seguindo SETUP.md.';
        return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Enviando...';
      try {
        const payload = new FormData(form);
        payload.set('nome', document.getElementById('name').value.trim());
        payload.set('email', emailInput.value.trim().toLowerCase());
        payload.set('telefone', normalizePhone(phoneInput.value));
        payload.set('whatsapp', normalizePhone(whatsappInput.value));

        const response = await fetch(`${SUPABASE_URL}/functions/v1/register-barber`, {
          method: 'POST',
          headers: { apikey: SUPABASE_PUBLISHABLE_KEY },
          body: payload
        });

        const result = await response.json().catch(() => ({}));
        if (response.status === 409) {
          throw new Error('Este e-mail ou telefone já está cadastrado.');
        }
        if (!response.ok) {
          throw new Error(result.error || 'Não foi possível concluir o cadastro. Tente novamente.');
        }

        status.textContent = 'Cadastro criado! Enviamos um link de confirmação para seu e-mail. Confirme-o para ativar sua conta.';
        form.reset();
        document.getElementById('avatar').textContent = 'Sua foto';
      } catch (error) {
        status.textContent = error.message || 'Falha ao conectar com o serviço de cadastro.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Criar cadastro';
      }
    });
  </script>
</body>
</html>
