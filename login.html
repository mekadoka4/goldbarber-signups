<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Entre na sua conta GoldBarber usando seu e-mail e senha.">
  <title>Entrar · GoldBarber</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --panel: #151515;
      --line: #393631;
      --text: #f4f0e8;
      --muted: #a8a39a;
      --gold: #c8a665;
    }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 15px/1.5 Arial, sans-serif; }
    main { width: min(100%, 480px); padding: 36px; border: 1px solid #393329; border-radius: 20px; background: var(--panel); box-shadow: 0 24px 80px #0008; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 750; text-decoration: none; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid #8e7547; border-radius: 12px; color: var(--gold); font: 21px Georgia, serif; }
    .brand small { display: block; color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .2em; }
    .eyebrow { display: block; margin-top: 30px; color: var(--gold); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(28px, 5vw, 38px); }
    .sub { margin: 0 0 26px; color: var(--muted); }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 7px; color: #e4ddcf; font-size: 13px; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; background: #0d0d0d; color: #fff; font: inherit; }
    input:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
    button, .button-link { display: flex; width: 100%; min-height: 48px; align-items: center; justify-content: center; margin-top: 5px; padding: 0 16px; border: 0; border-radius: 9px; background: var(--gold); color: #14110b; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .7; }
    .secondary { border: 1px solid #4a4336; background: transparent; color: var(--text); }
    .status { min-height: 22px; margin: 0; color: #e4c47d; font-size: 13px; }
    .session p { color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 22px; font-size: 13px; }
    .links a { color: var(--gold); }
    [hidden] { display: none !important; }
    @media (max-width: 540px) { main { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./" aria-label="GoldBarber início">
      <span class="brand-mark">G</span>
      <span>GoldBarber<small>SAAS PREMIUM</small></span>
    </a>
    <span class="eyebrow">Área do barbeiro</span>
    <h1>Entre na sua conta</h1>
    <p class="sub">Use o e-mail e a senha cadastrados. É necessário confirmar o e-mail antes de entrar.</p>

    <form id="login-form">
      <label for="email">E-mail
        <input id="email" name="email" type="email" autocomplete="username" required>
      </label>
      <label for="password">Senha
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button id="submit" type="submit" disabled>Entrar</button>
    </form>

    <section class="session" id="session" aria-live="polite" hidden>
      <h2>Login realizado</h2>
      <p id="account"></p>
      <p>A autenticação foi concluída. O painel GoldBarber ainda não está disponível.</p>
      <button class="secondary" id="logout" type="button">Sair da conta</button>
    </section>

    <nav class="links" aria-label="Navegação">
      <a href="./">Voltar ao início</a>
      <a href="signup.html">Criar cadastro</a>
    </nav>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');
    const sessionPanel = document.getElementById('session');
    const account = document.getElementById('account');

    form.addEventListener('submit', event => event.preventDefault());

    (async () => {
      const supabaseUrl = 'https://qfboniifeieauwbjlifp.supabase.co';
      const publishableKey = 'sb_publishable_zMTYD3WAMHa7i-oJQFl-FA_rC7m0EVu';
      let supabase;

      function showSession(user) {
        form.hidden = true;
        sessionPanel.hidden = false;
        account.textContent = user.email || 'Conta autenticada';
      }

      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabase = createClient(supabaseUrl, publishableKey);
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (data.session) showSession(data.session.user);
        else submit.disabled = false;
      } catch {
        status.textContent = 'Serviço de login indisponível no momento. Tente novamente mais tarde.';
        return;
      }

      form.addEventListener('submit', async () => {
        status.textContent = '';
        if (!form.reportValidity()) return;

        submit.disabled = true;
        submit.textContent = 'Entrando...';
        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: document.getElementById('email').value.trim().toLowerCase(),
            password: document.getElementById('password').value,
          });
          if (error) {
            if (error.code === 'email_not_confirmed') {
              status.textContent = 'Confirme seu e-mail pelo link enviado antes de entrar.';
            } else if (error.code === 'invalid_credentials') {
              status.textContent = 'E-mail ou senha incorretos.';
            } else if (error.code === 'over_request_rate_limit') {
              status.textContent = 'Muitas tentativas. Aguarde um pouco e tente novamente.';
            } else {
              status.textContent = 'Não foi possível entrar. Verifique seus dados e tente novamente.';
            }
            return;
          }
          showSession(data.user);
        } catch {
          status.textContent = 'Falha ao conectar com o serviço de login. Tente novamente.';
        } finally {
          submit.disabled = false;
          submit.textContent = 'Entrar';
        }
      });

      document.getElementById('logout').addEventListener('click', async () => {
        const logout = document.getElementById('logout');
        logout.disabled = true;
        try {
          const { error } = await supabase.auth.signOut();
          if (error) {
            account.textContent = 'Não foi possível encerrar a sessão. Tente novamente.';
            return;
          }
          sessionPanel.hidden = true;
          form.hidden = false;
          document.getElementById('password').value = '';
          status.textContent = 'Você saiu da sua conta.';
        } catch {
          account.textContent = 'Falha ao conectar para encerrar a sessão.';
        } finally {
          logout.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
